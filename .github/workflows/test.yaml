name: Test
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:

        os: [windows-latest, windows-11-arm]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.14t', '3.15', '3.15t']
        exclude:
          - os: windows-11-arm  # setup-python action only supports 3.11+
            python-version: '3.10'
          - os: windows-11-arm  # workflow keeps screwing around with us.
            python-version: '3.14t'
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        check-latest: true
        python-version: ${{ matrix.python-version }}
    - name: Install Requirements
      run: python -m pip install --upgrade setuptools wheel pip cython pytest aiohttp aiodns

    - name: Compile Winloop
      run: pip install -e .

    - name: run-tests
      env:
        COLOR: yes
        PIP_USER: 1
      run: pytest -vv
      shell: bash

  # Allow dependabot to run a after all tests have passed through.
  # This will enable lazy merging.
  dependabot:
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
